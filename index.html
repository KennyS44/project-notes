<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Проект · заметки и задачи</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23efeeec'/%3E%3Ccircle cx='8' cy='8' r='5' fill='%23b8352d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="sun" aria-hidden="true"></span>
      <input id="title" class="title-input" aria-label="Название проекта" maxlength="80" spellcheck="false">
    </div>
    <div class="actions">
      <button id="add-table" class="btn primary" type="button">+ таблица</button>
      <button id="export" class="btn" type="button" title="Скачать все данные в файл .json">экспорт</button>
      <button id="import" class="btn" type="button" title="Загрузить данные из файла .json">импорт</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main id="board" class="board" aria-live="polite"></main>

  <footer class="status">
    <span id="status">сохранено в этом браузере</span>
    <span id="summary" class="muted"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
