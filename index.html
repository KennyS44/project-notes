<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Проект · заметки и задачи</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23efeeec'/%3E%3Ccircle cx='8' cy='8' r='5' fill='%23b8352d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved theme before first paint (no flash). */
    (function () {
      var t = null;
      try { t = localStorage.getItem('project-notes:theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="sun" aria-hidden="true"></span>
      <input id="title" class="title-input" aria-label="Название проекта" maxlength="80" spellcheck="false">
    </div>
    <div class="actions">
      <button id="theme" class="icon-btn theme-btn" type="button" aria-label="Тёмная тема" title="Тёмная тема">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
      </button>
      <button id="add-table" class="btn primary" type="button">+ таблица</button>
      <button id="export" class="btn" type="button" title="Скачать все данные в файл .json">экспорт</button>
      <button id="import" class="btn" type="button" title="Загрузить данные из файла .json">импорт</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main id="board" class="board" aria-live="polite"></main>

  <footer class="status">
    <span id="status">сохранено в этом браузере</span>
    <span id="summary" class="muted"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
