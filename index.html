<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Проект · заметки и задачи</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a1918'/%3E%3Cpath d='M4 4l4 4-4 4' stroke='%23d97757' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <input id="title" class="title-input" aria-label="Название проекта" maxlength="80" spellcheck="false">
    </div>
    <div class="actions">
      <button id="add-table" class="btn primary" type="button">+ таблица</button>
      <button id="export" class="btn" type="button" title="Скачать все данные в файл .json">экспорт</button>
      <button id="import" class="btn" type="button" title="Загрузить данные из файла .json">импорт</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main id="board" class="board" aria-live="polite"></main>

  <footer class="status">
    <span id="status">● сохранено в этом браузере</span>
    <span id="summary" class="muted"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
